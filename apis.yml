- aid: u-s-geological-survey:u-s-geological-survey-hydrologic-unit-codes-api
  name: U.S. Geological Survey Hydrologic Unit Codes API
  description: >-
    Hydrologic units are geographic areas representing part or all of a surface drainage basin or distinct
    hydrologic feature identified by a unique number (HUC), and a name. The United States is divided and
    sub-divided into successively smaller hydrologic units which are classified into four levels: regions,
    sub-regions, accounting units, and cataloging units. Each unit consists of two to eight digits based
    on the four levels of classification in the hydrologic unit system. Additional information can be
    found at &lt;https://water.usgs.gov/GIS/huc.html&gt;.
  humanURL: https://www.usgs.gov/tools/asset-identifier-service-ais
