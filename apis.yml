- aid: u-s-geological-survey:u-s-geological-survey-parameter-codes-api
  name: U.S. Geological Survey Parameter Codes API
  description: >-
    Parameter codes are 5-digit codes and associated descriptions used to identify the constituent measured
    and the units of measure. Some parameter code definitions include information about the sampling matrix,
    fraction, and methods used to measure the constituent. Some parameters are fixed-value (fxd) numeric
    codes having textual meaning (for example: parameter code 00041 is a weather code parameter, code
    of 60 means rain), but more commonly represent a numeric value for chemical, physical, or biological
    data.
  humanURL: https://www.usgs.gov/tools/asset-identifier-service-ais
  baseURL: https://earthquake.usgs.gov/fdsnws/event/1
