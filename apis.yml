- aid: u-s-geological-survey:u-s-geological-survey-peaks-api
  name: U.S. Geological Survey Peaks API
  description: >-
    Annual peak flow values are the maximum instantaneous streamflow values recorded at a particular site
    for the entire water year from October 1 to September 30. Note that the annual peak flow value may
    not occur at the same time the maximum water level occurs due to conditions such as backwater, tidal
    fluctuations, etc.
