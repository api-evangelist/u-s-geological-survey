- aid: u-s-geological-survey:u-s-geological-survey-time-series-revisions-api
  name: U.S. Geological Survey Time Series Revisions API
  description: >-
    Approved water data are considered published record, but on occasion changes or deletions (revisions)
    must be made to data after they are approved. Data revisions are rare because of USGS quality assurance
    practices, including documentation of all data before they are officially approved. This field contains
    text explanations for data revisions on a specific time series. Changes to data also are indicated
    with revision qualifier codes alongside the data. Text explanations before 2017 are not necessarily
    available online, but can be requested. This collection is non-spatial: revision records carry no
    geometry, so bbox/spatial filters are not supported.
  humanURL: https://www.usgs.gov/tools/asset-identifier-service-ais
  baseURL: https://earthquake.usgs.gov/fdsnws/event/1
