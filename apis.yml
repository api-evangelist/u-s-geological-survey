- aid: u-s-geological-survey:u-s-geological-survey-time-series-metadata-api
  name: U.S. Geological Survey Time Series Metadata API
  description: >-
    Daily data and continuous measurements are grouped into time series, which represent a collection
    of observations of a single parameter, potentially aggregated using a standard statistic, at a single
    monitoring location. This endpoint provides metadata about those time series, including their operational
    thresholds, units of measurement, and when the earliest and most recent observations in a time series
    occurred.
