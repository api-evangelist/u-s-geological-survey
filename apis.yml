- aid: u-s-geological-survey:u-s-geological-survey-aquifer-types-api
  name: U.S. Geological Survey Aquifer Types API
  description: >-
    Groundwater occurs in aquifers under two different conditions. Where water only partly fills an aquifer,
    the upper surface is free to rise and decline. These aquifers are referred to as unconfined (or water-table)
    aquifers. Where water completely fills an aquifer that is overlain by a confining bed, the aquifer
    is referred to as a confined (or artesian) aquifer. When a confined aquifer is penetrated by a well,
    the water level in the well will rise above the top of the aquifer (but not necessarily above land
    surface).
