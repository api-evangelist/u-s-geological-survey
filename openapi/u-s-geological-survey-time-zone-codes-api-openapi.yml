          type: array
        style: form
      - $ref: '#/components/parameters/skipGeometry'
      - $ref: https://raw.githubusercontent.com/opengeospatial/ogcapi-records/master/core/openapi/parameters/sortby.yaml
      - $ref: '#/components/parameters/offset'
      - description: Time zone code. An NWIS time zone code.
        explode: false
        in: query
        name: id
        required: false
        schema:
          description: Time zone code. An NWIS time zone code.
          type: string
        style: form
      - description: Time zone name. An English name for a world time zone.
        explode: false
        in: query
        name: time_zone_name
        required: false
        schema:
          description: Time zone name. An English name for a world time zone.
          type: string
        style: form
      - description: Time zone description.
        explode: false
        in: query
        name: time_zone_description
        required: false
        schema:
          description: Time zone description.
          type: string
        style: form
      - description: Coordinated Universal Time (UTC) offset time. The number of hours offset from UTC time, in ISO format.
        explode: false
        in: query
        name: time_zone_utc_offset
        required: false
        schema:
          description: Coordinated Universal Time (UTC) offset time. The number of hours offset from UTC time, in ISO format.
          type: string
        style: form
      - description: Time zone Daylight Saving Time code.
        explode: false
        in: query
        name: time_zone_daylight_savings_time_code
        required: false
        schema:
          description: Time zone Daylight Saving Time code.
          type: string
        style: form
      - description: Time zone Daylight Saving Time name.
        explode: false
        in: query
        name: time_zone_daylight_savings_time_name
        required: false
        schema:
          description: Time zone Daylight Saving Time name.
          type: string
        style: form
      - description: Daylight Saving Time offset time. The number of hours offset from UTC time when Daylight Saving Time is in effect, in ISO format.
        explode: false
        in: query
        name: time_zone_daylight_savings_utc_offset
        required: false
        schema:
          description: Daylight Saving Time offset time. The number of hours offset from UTC time when Daylight Saving Time is in effect, in ISO format.
          type: string
        style: form
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          $ref: '#/components/responses/TimeZoneCodesFeatures'
        '400':
          $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/responses/InvalidParameter
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/responses/NotFound
        '429':
          $ref: '#/components/responses/TooManyRequests429'
        '500':
          $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/responses/ServerError
      security:
      - ApiKeyQuery: []
      - ApiKeyHeader: []
      summary: Get Time zone codes items
      tags:
      - time-zone-codes
    options:
      description: 'The ISO 8601 standard defines time zone offsets as a numerical value added to a local time to convert it to Coordinated Universal Time (UTC), either as +hh:mm or -hh:mm, or represented by the letter Z to explicitly indicate UTC. For example, +05:30 means 5 hours and 30 minutes ahead of UTC, while -08:00 means 8 hours behind UTC. The offset Z specifically signifies UTC.

        '
      operationId: optionsTime-zone-codesFeatures
      responses:
        '200':
