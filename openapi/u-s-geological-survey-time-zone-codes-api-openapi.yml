components:
  responses:
    TimeZoneCodesFeatures:
      content:
        application/geo+json:
          example:
            features:
            - geometry: null
              id: UTC
              properties:
                id: UTC
                time_zone_daylight_savings_time_code: NDT
                time_zone_daylight_savings_time_name: Newfoundland Daylight Time
                time_zone_daylight_savings_utc_offset: -02:30
                time_zone_description: Universal Coordinated Time
                time_zone_name: Universal Coordinated Time
                time_zone_utc_offset: +00:00
              type: Feature
            links:
            - href: https://api.waterdata.usgs.gov/ogcapi/v0/collections/time-zone-codes/items
              rel: self
              title: This document as GeoJSON
              type: application/geo+json
            numberReturned: 1
            timeStamp: '2024-07-21T12:00:00Z'
            type: FeatureCollection
          schema:
            $ref: '#/components/schemas/TimeZoneCodesFeatureCollection'
        text/html:
          schema:
            type: string
      description: A feature collection of Time zone codes.
    Queryables:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/queryables'
      description: successful queryables operation
    TimeZoneCodesFeature:
      content:
        application/geo+json:
          example:
            geometry: null
            id: UTC
            properties:
              id: UTC
              time_zone_daylight_savings_time_code: NDT
              time_zone_daylight_savings_time_name: Newfoundland Daylight Time
              time_zone_daylight_savings_utc_offset: -02:30
              time_zone_description: Universal Coordinated Time
              time_zone_name: Universal Coordinated Time
              time_zone_utc_offset: +00:00
            type: Feature
          schema:
            $ref: '#/components/schemas/TimeZoneCodesFeature'
        text/html:
          schema:
            type: string
      description: A single feature from Time zone codes.
