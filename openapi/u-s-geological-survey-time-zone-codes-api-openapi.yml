        in: query
        name: limit
        required: false
        schema:
          default: 10000
          maximum: 50000
          minimum: 1
          type: integer
        style: form
      - $ref: '#/components/parameters/crs'
      - $ref: '#/components/parameters/bbox-crs'
      - description: The properties that should be included. The parameter value is a comma-separated list of property names.
        explode: false
        in: query
        name: properties
        required: false
        schema:
          items:
            enum:
            - id
            - time_zone_name
            - time_zone_description
            - time_zone_utc_offset
            - time_zone_daylight_savings_time_code
            - time_zone_daylight_savings_time_name
            - time_zone_daylight_savings_utc_offset
